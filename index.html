<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronômetro Interativo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="conteudo-principal">
    <h1 class="titulo-principal">Meus <span>Objetivos do Ano</span></h1>

    <div class="botoes">
      <button class="botao ativo">Objetivo 1</button>
      <button class="botao">Objetivo 2</button>
      <button class="botao">Objetivo 3</button>
      <button class="botao">Objetivo 4</button>
    </div>

    <div class="abas-textos">
      <div class="aba-conteudo ativo">
        <h3 class="aba-conteudo-titulo-principal">Meta 1</h3>
        <h4 class="aba-conteudo-titulo-secundario">Tempo restante</h4>
        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias0">0</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas0">0</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min0">0</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg0">0</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>

      <!-- Repita o bloco abaixo para os outros objetivos -->

      <div class="aba-conteudo">
        <h3 class="aba-conteudo-titulo-principal">Meta 2</h3>
        <h4 class="aba-conteudo-titulo-secundario">Tempo restante</h4>
        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias1">0</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas1">0</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min1">0</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg1">0</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>

      <div class="aba-conteudo">
        <h3 class="aba-conteudo-titulo-principal">Meta 3</h3>
        <h4 class="aba-conteudo-titulo-secundario">Tempo restante</h4>
        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias2">0</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas2">0</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min2">0</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg2">0</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>

      <div class="aba-conteudo">
        <h3 class="aba-conteudo-titulo-principal">Meta 4</h3>
        <h4 class="aba-conteudo-titulo-secundario">Tempo restante</h4>
        <div class="contador">
          <div class="contador-digito">
            <p class="contador-digito-numero" id="dias3">0</p>
            <p class="contador-digito-texto">dias</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="horas3">0</p>
            <p class="contador-digito-texto">horas</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="min3">0</p>
            <p class="contador-digito-texto">min</p>
          </div>
          <div class="contador-digito">
            <p class="contador-digito-numero" id="seg3">0</p>
            <p class="contador-digito-texto">seg</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
